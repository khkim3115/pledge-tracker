[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pledge-pipeline"
version = "0.1.0"
description = "공약 이행 추적 — 수집·처리 파이프라인"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/pledge_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
