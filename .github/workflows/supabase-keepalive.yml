name: supabase-keepalive

# Supabase Free 플랜은 7일 유휴 시 일시정지된다. 스케줄 실행은 지연·누락될 수 있어 주 2회 핑한다.
on:
  schedule:
    - cron: "23 3 * * 1,4" # 월·목 03:23 UTC (12:23 KST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Ping Supabase REST (public read)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY 시크릿 미설정 — 핑 건너뜀"
            exit 0
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/adapters?select=adapter_id&limit=1")
          echo "HTTP ${code}"
          if [ "$code" != "200" ]; then
            head -c 500 /tmp/body; echo
            exit 1
          fi

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
