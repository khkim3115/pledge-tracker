name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  migrations:
    # Supabase 마이그레이션을 pgvector 포함 Postgres 17에 적용해 본다 (Supabase 전용 롤·스키마는 스텁)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Supabase stubs
        # Supabase 기본 권한(anon/authenticated에 ALL)까지 재현해야 권한 최소화 구문이 빠졌을 때 CI가 잡는다
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema extensions;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          alter default privileges in schema public grant all on tables to anon, authenticated, service_role;
          alter default privileges in schema public grant all on sequences to anon, authenticated, service_role;
          alter default privileges in schema public grant all on functions to anon, authenticated, service_role;
          SQL

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Smoke test
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into winners (winner_id, sg_id, sg_type, huboid, term, sido_name, sgg_name, region, name, raw)
            values ('20220601-1', '20220601', 3, '1', 8, '가상도', '가상도', '가상도', '테스트', '{}');
          insert into pledges (pledge_id, winner_id, ord, title, term) values ('20220601-1-1', '20220601-1', 1, '공약', 8);
          insert into matches (pledge_id, task_id, method) values ('20220601-1-1', null, 'llm');
          insert into judgments (pledge_id, verdict, model, prompt_version) values ('20220601-1-1', 'on_track', 'm', 'v0');
          insert into judgments (pledge_id, verdict, model, prompt_version) values ('20220601-1-1', 'completed', 'm', 'v0');
          SQL
          # 최신 판정만 current_judgments에 노출
          test "$(psql -tAc "select verdict from current_judgments")" = completed
          # 모든 public 테이블에 RLS 적용
          test "$(psql -tAc "select count(*) from pg_tables where schemaname = 'public' and not rowsecurity")" = 0
          # anon: 공개 테이블 읽기 가능, 쓰기·내부 테이블 접근 불가 (접속 시 role 지정 → 결과 1개만 출력)
          as_anon() { PGOPTIONS="-c role=anon" psql -v ON_ERROR_STOP=1 -tAc "$1"; }
          test "$(as_anon "select count(*) from normalized_statuses")" = 5
          test "$(as_anon "select count(*) from current_judgments")" = 1
          for sql in \
            "insert into adapters (adapter_id, region, term, base_url, parser_type) values ('x', 'x', 9, 'x', 'html')" \
            "delete from pledges" \
            "select * from qa_cache" \
            "select * from golden_set"; do
            if as_anon "$sql" >/dev/null 2>&1; then
              echo "::error::anon 권한 과다: $sql"; exit 1
            fi
          done
          # postgres가 public에 새로 만드는 객체의 기본 권한에 anon/authenticated가 남아 있으면 안 된다
          test "$(psql -tAc "select count(*) from pg_default_acl d join pg_namespace n on n.oid = d.defaclnamespace, aclexplode(d.defaclacl) a where n.nspname = 'public' and d.defaclrole = 'postgres'::regrole and a.grantee in ('anon'::regrole, 'authenticated'::regrole)")" = 0
          # public 스키마 함수는 anon이 실행할 수 없어야 한다. 공개 RPC가 생기면 allowed_rpc에 이름 추가
          allowed_rpc="''"
          exposed=$(psql -tAc "select string_agg(p.oid::regprocedure::text, ', ') from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and has_function_privilege('anon', p.oid, 'EXECUTE') and p.proname not in (${allowed_rpc})")
          if [ -n "$exposed" ]; then
            echo "::error::anon이 실행 가능한 함수: $exposed (revoke execute on function ... from public, anon, authenticated 필요)"; exit 1
          fi
          # NONE 매칭 중복은 거부돼야 한다 (unique nulls not distinct)
          if psql -v ON_ERROR_STOP=1 -c "insert into matches (pledge_id, task_id, method) values ('20220601-1-1', null, 'llm');"; then
            echo "::error::NONE 매칭 중복이 허용됨"; exit 1
          fi
