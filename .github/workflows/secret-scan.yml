name: secret-scan

# pre-commit 훅은 로컬 설치에 의존하므로, push/PR마다 전체 히스토리를 한 번 더 검사한다.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan full history
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --verbose .

      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: "시크릿 유출 의심 — 즉시 키 폐기·재발급 검토"
